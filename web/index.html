<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f14" />
    <title>ASIAIR Commander</title>
    <script>
      // Apply the persisted (or system-preferred) theme before first paint so the
      // page never flashes the wrong theme. Mirrors useTheme's resolution order.
      (function () {
        try {
          var stored = localStorage.getItem("aac-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          /* localStorage unavailable — keep the dark default from the markup. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
