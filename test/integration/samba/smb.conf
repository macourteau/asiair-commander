# The ASIAIR-mimicking SMB1 server: NT1 protocol only, NTLMv2 authentication
# (smb1client's dialer never falls back to plaintext), one writable data share
# whose name carries a space — as the real "EMMC Images"/"TF Images" shares do.
[global]
   server min protocol = NT1
   server max protocol = NT1
   ntlm auth = ntlmv2-only
   # The rig answers the documented guest/12345678 login by granting a guest
   # session rather than by authenticating that name — no such account exists on
   # it. Mapping the unknown user to guest reproduces that downgrade, which is
   # what the client has to accept; a real account here would authenticate
   # normally and the fixture would stop resembling the device.
   map to guest = bad user
   security = user
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   disable netbios = yes
   smb ports = 445
   log level = 1

[EMMC Images]
   path = /shares/EMMC Images
   browseable = yes
   writable = yes
   guest ok = yes
   # The seeded tree is created as root at image-build time; forcing every
   # session onto root sidesteps ownership mismatches so the guest session's
   # WriteMarker and Delete land on root-owned files (mirrors the ASIAIR, where
   # the guest session has full run of the removable media).
   force user = root
