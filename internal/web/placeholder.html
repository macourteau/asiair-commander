<!doctype html>
<!--
  Served in place of the SPA's index.html by a binary built without the web
  interface (a bare `go build`, with nothing staged into internal/web/dist).
  `make spa` (or `make build`) stages the real build, which takes precedence.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASIAIR Commander</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
      code { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>ASIAIR Commander</h1>
    <p>
      This binary was built without the web interface. The service itself is
      running; rebuild with <code>make spa</code> (or <code>make build</code>)
      to embed the UI.
    </p>
  </body>
</html>
